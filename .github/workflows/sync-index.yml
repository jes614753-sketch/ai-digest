name: sync index
on:
  push:
    branches: [main]
    paths: ["data/**"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/build_index.py
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: sync index.json"
